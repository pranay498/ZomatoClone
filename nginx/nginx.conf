# ─────────────────────────────────────────────────────────────────
# Nginx — Edge reverse proxy for ZomatoClone on EC2
#
# Traffic flow:
#   Browser → EC2:80 (Nginx) → {frontend, api-gateway, realtime-ws}
#
# Ports inside Docker network (not exposed to host):
#   frontend      :80   (Nginx serving Vite build)
#   api-gateway   :8000
#   realtime      :8004 (Socket.io WebSocket)
# ─────────────────────────────────────────────────────────────────

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # ── Gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Upstream definitions ───────────────────────────────────────
    upstream api_gateway {
        server api-gateway:8000;
    }

    upstream realtime_service {
        server realtime:8004;
    }

    upstream frontend_app {
        server frontend:80;
    }

    # ── Main server ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;           # Replace with your domain or EC2 public IP

      
        location /socket.io/ {
            proxy_pass         http://realtime_service;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout  86400;   # keep WS alive for 24h
            proxy_send_timeout  86400;
        }

        # ── REST API — routed to API Gateway ──────────────────────
        location /api/ {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward cookies (needed for auth)
            proxy_pass_header  Set-Cookie;

            # Disable buffering for streaming / SSE
            proxy_buffering    off;

            # Timeouts (long for payment webhooks)
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # ── Frontend — React SPA ───────────────────────────────────
        location / {
            proxy_pass         http://frontend_app;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Health check ───────────────────────────────────────────
        location /nginx-health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
